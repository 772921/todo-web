<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待办清单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 16px;
    }

    .app {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #5a67d8, #6b46c1);
      color: #fff;
      padding: 24px 28px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 600;
    }

    .header .stats {
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.85;
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 20px 24px 8px;
    }

    .input-row input {
      flex: 1;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus {
      border-color: #6b46c1;
    }

    .input-row button {
      background: #6b46c1;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-row button:hover {
      background: #553c9a;
    }

    ul {
      list-style: none;
      padding: 8px 16px 16px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-radius: 10px;
      animation: fadeIn 0.25s ease;
    }

    li:hover {
      background: #f7fafc;
    }

    li input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #6b46c1;
      cursor: pointer;
      flex-shrink: 0;
    }

    li .text {
      flex: 1;
      font-size: 15px;
      color: #2d3748;
      word-break: break-all;
      cursor: pointer;
    }

    li.done .text {
      text-decoration: line-through;
      color: #a0aec0;
    }

    li .del {
      border: none;
      background: transparent;
      color: #e53e3e;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }

    li:hover .del {
      opacity: 1;
    }

    li .del:hover {
      background: #fed7d7;
    }

    .empty {
      text-align: center;
      color: #a0aec0;
      padding: 30px 0 40px;
      font-size: 14px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>📝 待办清单</h1>
      <div class="stats" id="stats">共 0 项</div>
    </div>

    <div class="input-row">
      <input type="text" id="todoInput" placeholder="输入待办事项，按回车添加…" maxlength="100" />
      <button id="addBtn">添加</button>
    </div>

    <ul id="todoList"></ul>
    <div class="empty" id="emptyHint">暂无待办事项，添加一个吧～</div>
  </div>

  <script>
    const STORAGE_KEY = "todos";
    let todos = [];
    try {
      todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      todos = [];
    }

    const input = document.getElementById("todoInput");
    const addBtn = document.getElementById("addBtn");
    const list = document.getElementById("todoList");
    const emptyHint = document.getElementById("emptyHint");
    const stats = document.getElementById("stats");

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function updateStats() {
      const done = todos.filter((t) => t.done).length;
      stats.textContent = `共 ${todos.length} 项，已完成 ${done} 项`;
      emptyHint.style.display = todos.length === 0 ? "block" : "none";
    }

    function render() {
      list.innerHTML = "";
      todos.forEach((todo, index) => {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => {
          todos[index].done = checkbox.checked;
          save();
          render();
        });

        const span = document.createElement("span");
        span.className = "text";
        span.textContent = todo.text;
        span.addEventListener("click", () => {
          todos[index].done = !todos[index].done;
          save();
          render();
        });

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "✕";
        del.title = "删除";
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          todos.splice(index, 1);
          save();
          render();
        });

        li.append(checkbox, span, del);
        list.appendChild(li);
      });
      updateStats();
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.unshift({ text, done: false });
      input.value = "";
      save();
      render();
      input.focus();
    }

    addBtn.addEventListener("click", addTodo);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTodo();
    });

    render();
  </script>
</body>
</html>
